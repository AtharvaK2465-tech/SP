<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SysWatch</title>
<style>
:root{--bg:#0a0d14;--panel:#101722;--panel2:#151e2b;--text:#e8eef7;--muted:#8ea0b7;--line:#263244;--accent:#58a6ff;--good:#42d392;--warn:#f4c95d;--bad:#ff6b7a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px}.brand{font-size:20px;font-weight:800;padding:10px 12px 20px}.nav button{width:100%;background:0;border:0;color:var(--muted);padding:11px 12px;text-align:left;border-radius:8px;margin:2px 0}.nav button.active,.nav button:hover{background:var(--panel2);color:var(--text)}main{min-width:0}.top{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 22px;position:sticky;top:0;background:rgba(10,13,20,.92);backdrop-filter:blur(12px);z-index:5}.search{flex:1;max-width:460px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--text)}.status{display:flex;gap:8px;align-items:center;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;background:var(--good)}.content{padding:22px;max-width:1600px;margin:auto}.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.title h1{margin:0;font-size:25px}.muted{color:var(--muted)}.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.metric{font-size:27px;font-weight:750;margin:5px 0}.bar{height:8px;background:var(--panel2);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}.chart{width:100%;height:190px;display:block}.tablewrap{overflow:auto;max-height:650px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{position:sticky;top:0;background:var(--panel);color:var(--muted);font-size:12px}.row:hover{background:var(--panel2)}.pill{padding:3px 7px;border-radius:999px;background:var(--panel2);font-size:12px}.actions{display:flex;gap:5px}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:7px 10px;border-radius:7px}.danger{color:var(--bad)}.warn{color:var(--warn)}.good{color:var(--good)}.form{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.form input,.form select{background:var(--panel2);color:var(--text);border:1px solid var(--line);padding:8px;border-radius:7px}.tree{font-family:ui-monospace,monospace}.node{padding:6px 0}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:20}.modal>div{width:min(900px,92vw);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.pre{white-space:pre-wrap;font-family:ui-monospace,monospace;background:var(--panel2);padding:10px;border-radius:8px;overflow:auto}.toast{position:fixed;right:18px;bottom:18px;background:var(--panel);border:1px solid var(--line);padding:11px 14px;border-radius:9px;z-index:30}@media(max-width:900px){.app{grid-template-columns:70px 1fr}.brand{font-size:0}.brand:after{content:'SW';font-size:18px}.nav button{font-size:0;text-align:center}.nav button:before{content:'•';font-size:18px}.g4,.g2{grid-template-columns:1fr}.top{padding:0 10px}.top .extra{display:none}.content{padding:12px}}
.light{--bg:#f5f7fa;--panel:#fff;--panel2:#eef2f7;--text:#142033;--muted:#64748b;--line:#dbe2ea}
</style></head><body><div id="app"></div><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={page:'overview',snap:null,hist:[],paused:false,query:'',user:'',state:'',sort:'cpu',alerts:{thresholds:{cpu:90,memory:90,disk:90},events:[]},detail:null,theme:localStorage.theme||'dark'};
const pages=['overview','processes','tree','memory','network','disks','alerts','about'];
const fmt=n=>{n=Number(n)||0;if(n>=1024*1024)return(n/1024/1024).toFixed(1)+' GB';if(n>=1024)return(n/1024).toFixed(1)+' MB';return n.toFixed(0)+' KB'};
const pct=n=>Math.max(0,Math.min(100,Number(n)||0)).toFixed(0)+'%';
async function api(url,opt){let r=await fetch(url,opt),j=await r.json();if(!r.ok||j.ok===false)throw Error(j.error||r.statusText);return j}
async function load(){try{S.snap=await api('/api/stats');S.hist.push(S.snap);if(S.hist.length>60)S.hist.shift();if(!S.paused)render()}catch(e){toast(e.message,true)}}
function nav(){return '<aside class="side"><div class="brand">SysWatch</div><div class="nav">'+pages.map(p=>'<button class="'+(S.page===p?'active':'')+'" onclick="go(\''+p+'\')">'+p[0].toUpperCase()+p.slice(1)+'</button>').join('')+'</div></aside>'}
function top(){let s=S.snap||{};return '<header class="top"><input class="search" placeholder="Search processes..." value="'+esc(S.query)+'" oninput="S.query=this.value;render()"><div class="status"><i class="dot"></i> Live</div><span class="extra muted">'+esc(s.os?.hostname||'')+'</span><span class="extra muted">'+esc(s.os?.name||'')+'</span><span class="extra muted">Up '+uptime(s.uptime)+'</span><button class="btn" onclick="togglePause()">'+(S.paused?'Resume':'Pause')+'</button><button class="btn" onclick="theme()">Theme</button></header>'}
function uptime(x){x=Number(x)||0;let d=Math.floor(x/86400);x%=86400;let h=Math.floor(x/3600);x%=3600;let m=Math.floor(x/60);return d+'d '+h+'h '+m+'m'}
function card(t,v,sub=''){return '<div class="card"><div class="label">'+t+'</div><div class="metric">'+v+'</div><div class="muted">'+sub+'</div></div>'}
function gauge(t,v,sub=''){return '<div class="card"><div class="label">'+t+'</div><div class="metric">'+pct(v)+'</div><div class="bar"><i style="width:'+pct(v)+'"></i></div><div class="muted">'+sub+'</div></div>'}
function chart(id,data){setTimeout(()=>{let c=document.getElementById(id);if(!c)return;let x=c.getContext('2d'),w=c.width=c.clientWidth*devicePixelRatio,h=c.height=c.clientHeight*devicePixelRatio;x.scale(devicePixelRatio,devicePixelRatio);w=c.clientWidth;h=c.clientHeight;x.strokeStyle=getComputedStyle(document.body).getPropertyValue('--line');for(let i=1;i<5;i++){x.beginPath();x.moveTo(0,i*h/5);x.lineTo(w,i*h/5);x.stroke()}let vals=data.map(Number),max=Math.max(1,...vals),min=Math.min(0,...vals);x.strokeStyle=getComputedStyle(document.body).getPropertyValue('--accent');x.lineWidth=2;x.beginPath();vals.forEach((v,i)=>{let xx=vals.length<2?w/2:i*w/(vals.length-1),yy=h-((v-min)/(max-min||1))*h*.86-h*.05;i?x.lineTo(xx,yy):x.moveTo(xx,yy)});x.stroke()},0)}
function overview(){let s=S.snap||{},c=s.cpu||{},m=s.memory||{},sw=s.swap||{};return '<div class="title"><h1>Overview</h1><div class="actions"><button class="btn" onclick="location.href=\'/api/export?format=json\'">JSON</button><button class="btn" onclick="location.href=\'/api/export?format=csv\'">CSV</button></div></div><div class="grid g4">'+gauge('CPU',c.total,'Logical '+(c.logical||0)+' cores')+gauge('Memory',m.percent,fmt(m.used)+' / '+fmt(m.total))+gauge('Swap',sw.percent,fmt(sw.used)+' / '+fmt(sw.total))+card('Processes',s.processCount||0,'Monitor CPU '+Number(s.monitor?.cpu||0).toFixed(1)+'%')+'</div><div class="grid g2" style="margin-top:14px"><div class="card"><div class="label">CPU / 60 seconds</div><canvas id="cpuChart" class="chart"></canvas></div><div class="card"><div class="label">Memory / 60 seconds</div><canvas id="memChart" class="chart"></canvas></div><div class="card"><div class="label">Network / 60 seconds</div><canvas id="netChart" class="chart"></canvas></div><div class="card"><div class="label">Disk I/O / 60 seconds</div><canvas id="diskChart" class="chart"></canvas></div></div><div class="card" style="margin-top:14px"><div class="label">Top processes</div>'+procTable((s.processes||[]).slice(0,8),false)+'</div>'}
function procTable(rows,actions=true){return '<div class="tablewrap"><table class="table"><tr><th>PID</th><th>Name</th><th>User</th><th>CPU</th><th>RSS</th><th>State</th><th>Priority</th><th>Threads</th>'+(actions?'<th>Actions</th>':'')+'</tr>'+rows.map(p=>'<tr class="row" onclick="detail('+p.pid+')"><td>'+p.pid+'</td><td>'+esc(p.name)+'</td><td>'+esc(p.user)+'</td><td>'+Number(p.cpu).toFixed(1)+'%</td><td>'+fmt(p.rss)+'</td><td><span class="pill">'+p.state+'</span></td><td>'+esc(p.nice)+'</td><td>'+p.threads+'</td>'+(actions?'<td onclick="event.stopPropagation()"><div class="actions"><button class="btn" onclick="control('+p.pid+',15)">Term</button><button class="btn danger" onclick="control('+p.pid+',9,true)">Kill</button><button class="btn" onclick="control('+p.pid+',19)">Stop</button><button class="btn" onclick="control('+p.pid+',18)">Cont</button></div></td>':'')+'</tr>').join('')+'</table></div>'}
function processes(){let s=S.snap||{},rows=(s.processes||[]).filter(p=>(!S.query||p.name.toLowerCase().includes(S.query.toLowerCase())||String(p.pid).includes(S.query))&&(!S.user||p.user===S.user)&&(!S.state||p.state===S.state));rows.sort((a,b)=>S.sort==='name'?a.name.localeCompare(b.name):S.sort==='rss'?b.rss-a.rss:S.sort==='pid'?a.pid-b.pid:b.cpu-a.cpu);return '<div class="title"><h1>Processes</h1><div class="form"><select onchange="S.sort=this.value;render()"><option value="cpu">CPU</option><option value="rss">Memory</option><option value="pid">PID</option><option value="name">Name</option></select><select onchange="S.state=this.value;render()"><option value="">All states</option>'+['R','S','D','T','Z','I'].map(x=>'<option>'+x+'</option>').join('')+'</select></div></div><div class="card">'+procTable(rows)+'</div>'}
function tree(){let ps=S.snap?.processes||[],m=new Map(ps.map(p=>[p.pid,{...p,children:[]}]));ps.forEach(p=>{let n=m.get(p.pid),par=m.get(p.ppid);if(par)par.children.push(n)});function node(n,d){return '<div class="node" style="padding-left:'+d*18+'px">↳ <button onclick="detail('+n.pid+')">'+esc(n.name)+'</button> <span class="muted">#'+n.pid+' · '+n.cpu.toFixed(1)+'%</span>'+(n.children||[]).map(c=>node(c,d+1)).join('')+'</div>'}let roots=ps.filter(p=>!m.has(p.ppid));return '<div class="title"><h1>Process Tree</h1></div><div class="card tree">'+roots.map(n=>node(m.get(n.pid),0)).join('')+'</div>'}
function memory(){let s=S.snap||{},m=s.memory||{};return '<div class="title"><h1>Memory</h1></div><div class="grid g4">'+card('Used',fmt(m.used),pct(m.percent))+card('Available',fmt(m.available))+card('Total',fmt(m.total))+card('Swap',fmt(s.swap?.used)+' / '+fmt(s.swap?.total))+'</div><div class="card" style="margin-top:14px"><div class="label">Top memory consumers</div>'+procTable([...(s.processes||[])].sort((a,b)=>b.rss-a.rss).slice(0,15),false)+'</div>'}
async function network(){let n=S.snap?.net||[];return '<div class="title"><h1>Network</h1></div><div class="grid g2"><div class="card"><div class="label">Interface throughput</div>'+n.map(x=>'<div style="margin:12px 0"><b>'+esc(x.name)+'</b><div class="muted">↓ '+fmt(x.rx)+'/s · ↑ '+fmt(x.tx)+'/s</div></div>').join('')+'</div><div class="card"><div class="label">Connections</div><button class="btn" onclick="loadConnections()">Refresh</button><div id="connections" class="tablewrap" style="margin-top:10px"></div></div></div>'}
async function loadConnections(){try{let d=await api('/api/connections');$('#connections').innerHTML='<table class="table"><tr><th>Protocol</th><th>Local</th><th>Remote</th><th>State</th><th>PID</th></tr>'+d.connections.map(c=>'<tr><td>'+c.protocol+'</td><td>'+esc(JSON.stringify(c.local))+'</td><td>'+esc(JSON.stringify(c.remote))+'</td><td>'+esc(c.state)+'</td><td>'+c.pid+'</td></tr>').join('')+'</table>'}catch(e){toast(e.message,true)}}
function disks(){let d=S.snap?.disk||{};return '<div class="title"><h1>Disks</h1></div><div class="card">'+(d.partitions||[]).map(p=>'<div style="margin:14px 0"><div class="form"><b>'+esc(p.mount)+'</b><span class="muted">'+fmt(p.used)+' / '+fmt(p.total)+' · '+p.percent+'%</span></div><div class="bar"><i style="width:'+p.percent+'%"></i></div></div>').join('')+'</div><div class="grid g2" style="margin-top:14px">'+card('Read I/O',fmt(d.io?.read||0)+'/s')+card('Write I/O',fmt(d.io?.write||0)+'/s')+'</div>'}
function alerts(){let a=S.alerts;return '<div class="title"><h1>Alerts</h1></div><div class="card"><div class="form">'+['cpu','memory','disk'].map(k=>'<label>'+k.toUpperCase()+' <input id="th-'+k+'" type="number" min="0" max="100" value="'+a.thresholds[k]+'"></label>').join('')+'<button class="btn" onclick="saveAlerts()">Save</button></div></div><div class="card" style="margin-top:14px"><div class="label">History</div>'+a.events.slice().reverse().map(e=>'<div style="padding:9px 0;border-bottom:1px solid var(--line)"><b class="'+(e.severity==='critical'?'danger':'warn')+'">'+e.severity+'</b> '+e.kind+' '+e.value+'% / '+e.threshold+'% <span class="muted">'+e.timestamp+'</span></div>').join('')+'</div>'}
function about(){let s=S.snap||{};return '<div class="title"><h1>About / System</h1></div><div class="grid g2"><div class="card"><div class="label">System</div><p>OS: '+esc(s.os?.name)+' '+esc(s.os?.release)+'</p><p>Architecture: '+esc(s.os?.architecture)+'</p><p>Kernel: '+esc(s.os?.kernel)+'</p><p>Hostname: '+esc(s.os?.hostname)+'</p><p>CPU cores: '+s.cpu?.count+' / logical '+s.cpu?.logical+'</p><p>RAM: '+fmt(s.memory?.total)+'</p></div><div class="card"><div class="label">SysWatch overhead</div><p>PID: '+s.monitor?.pid+'</p><p>CPU: '+Number(s.monitor?.cpu||0).toFixed(1)+'%</p><p>RSS: '+fmt(s.monitor?.rss)+'</p><p class="muted">Telemetry is collected by a 1-second background sampler using psutil. The UI is offline and uses no CDN or build step.</p></div></div>'}
async function detail(pid){try{S.detail=await api('/api/proc/'+pid);renderModal()}catch(e){toast(e.message,true)}}
function renderModal(){let d=S.detail;if(!d)return;document.body.insertAdjacentHTML('beforeend','<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div><div class="title"><h1>'+esc(d.name)+' <span class="muted">#'+d.pid+'</span></h1><button class="btn" onclick="closeModal()">Close</button></div><p>Command: <code>'+esc((d.cmdline||[]).join(' '))+'</code></p><p>Parent: '+esc(JSON.stringify(d.parent))+' · Children: '+d.children.length+'</p><h3>Open Files</h3><div class="pre">'+esc(JSON.stringify(d.openFiles,null,2))+'</div><h3>Threads</h3><div class="pre">'+esc(JSON.stringify(d.threads,null,2))+'</div><h3>Memory Maps</h3><div class="pre">'+esc(JSON.stringify(d.memoryMaps,null,2))+'</div><h3>Connections</h3><div class="pre">'+esc(JSON.stringify(d.connections,null,2))+'</div><h3>Environment</h3><div class="pre">'+esc(JSON.stringify(d.environment,null,2))+'</div></div></div>')}
function closeModal(){$('#modal')?.remove();S.detail=null}
async function control(pid,sig,confirmKill=false){if(confirmKill&&!confirm('Force kill this process?'))return;try{await api('/api/kill?pid='+pid+'&sig='+sig,{method:'POST'});toast('Action completed');setTimeout(load,250)}catch(e){toast(e.message,true)}}
async function saveAlerts(){let body={cpu:+$('#th-cpu').value,memory:+$('#th-memory').value,disk:+$('#th-disk').value};try{await api('/api/alerts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});S.alerts=await api('/api/alerts');toast('Thresholds saved');render()}catch(e){toast(e.message,true)}}
function toast(t,bad=false){let x=document.createElement('div');x.className='toast';x.textContent=t;document.body.append(x);setTimeout(()=>x.remove(),2500)}
function go(p){S.page=p;render();if(p==='network')setTimeout(loadConnections,50)}
function togglePause(){S.paused=!S.paused;render()}
function theme(){S.theme=S.theme==='dark'?'light':'dark';localStorage.theme=S.theme;render()}
function render(){document.body.classList.toggle('light',S.theme==='light');let body=S.page==='overview'?overview():S.page==='processes'?processes():S.page==='tree'?tree():S.page==='memory'?memory():S.page==='network'?network():S.page==='disks'?disks():S.page==='alerts'?alerts():about();$('#app').innerHTML=nav()+'<main>'+top()+'<section class="content">'+body+'</section></main>';if(S.page==='overview'){chart('cpuChart',S.hist.map(x=>x.cpu?.total||0));chart('memChart',S.hist.map(x=>x.memory?.percent||0));chart('netChart',S.hist.map(x=>(x.net||[]).reduce((a,n)=>a+n.rx+n.tx,0)/1024));chart('diskChart',S.hist.map(x=>(x.disk?.io?.read||0)+(x.disk?.io?.write||0)));}}
setInterval(async()=>{if(!S.paused)await load()},1000);load();api('/api/alerts').then(x=>S.alerts=x).catch(()=>{});render();
</script></body></html>
